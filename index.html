<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Heilbronn 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="metrics-card.css" rel="stylesheet" />
  <link href="legend.css" rel="stylesheet" />
  <link href="about-card.css" rel="stylesheet" />
  <link href="time-slider.css" rel="stylesheet" />
  <link href="intro.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <style>
    html, body, #map { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
    #ui {
      position: absolute; top: 12px; left: 12px; z-index: 3;
      display: flex; align-items: center; gap: 3px; flex-wrap: wrap;
      max-width: calc(100vw - 314px); padding: 4px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.12);
    }
    #ui button {
      padding: 5px 8.5px; border: 1px solid transparent; border-radius: 8px;
      background: transparent; color: #1f2a30;
      cursor: pointer; font: 500 12px/1.2 system-ui, -apple-system, sans-serif;
      white-space: nowrap; transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    #ui button:hover:not(.active):not(:disabled) {
      background: rgba(15, 23, 42, 0.06);
    }
    #ui button.active {
      background: #1f6f43; color: #fff;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.2);
    }
    #count {
      position: absolute; bottom: 12px; left: 12px; z-index: 2;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.1);
      padding: 5px 12px; border-radius: 999px;
      font: 500 11.5px/1.2 system-ui, -apple-system, sans-serif;
      color: #475569; font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    @media (max-width: 760px) {
      #ui { max-width: calc(100vw - 64px); }
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="ui">
  <button id="btnTree" class="active">🌳 Place tree</button>
  <button id="btnBuilding">🏢 Place building</button>
  <button id="btnUndo">↩ Undo</button>
  <button id="btnOsm">Load real trees</button>
  <button id="btnNav">✋ Navigate only</button>
  <button id="btnInspect">ℹ Inspect tree</button>
  <button id="btnSelect">👆 Select</button>
  <button id="btnDelete">🗑 Delete selected</button>
  <button id="btnRestore">♻ Restore deleted</button>
</div>
<div id="count"></div>
<script type="module" src="metrics-card.js"></script>
<script type="module" src="legend.js"></script>
<script type="module" src="about-card.js"></script>
<script type="module" src="time-slider.js"></script>
<script type="module" src="intro.js"></script>
<script type="module" src="climate-layer.js"></script>

<script type="module">
import * as THREE from 'three';

import { addCadastre } from './cadastre.js';
let cadastre = null;

const ORIGIN = [9.2109, 49.1427];
let mode = 'tree';

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron', // light map
  center: ORIGIN,
  zoom: 17,
  pitch: 65,
  bearing: -20,
  maxPitch: 85,
  attributionControl: false
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

// ---------- three.js scene ----------
const originMerc = maplibregl.MercatorCoordinate.fromLngLat(ORIGIN, 0);
const unit = originMerc.meterInMercatorCoordinateUnits();

const scene = new THREE.Scene();
const camera = new THREE.Camera();
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(-100, 200, -100);
scene.add(sun);

// scene coords: x = east (m), y = up (m), z = south (m)
function toScene(lng, lat, up) {
  const m = maplibregl.MercatorCoordinate.fromLngLat([lng, lat], 0);
  return new THREE.Vector3((m.x - originMerc.x) / unit, up, (m.y - originMerc.y) / unit);
}
// Ground height in metres above sea level. queryTerrainElevation() is relative to the
// point in the middle of the screen, so add that point's height (map.transform.elevation).
function groundAt(lng, lat) {
  const e = map.queryTerrainElevation([lng, lat]);
  return (e == null ? 0 : e) + (map.transform.elevation || 0);
}

// ---------- tree ----------
const trunkGeo = new THREE.CylinderGeometry(0.25, 0.4, 4, 6);
const crownGeo = new THREE.IcosahedronGeometry(3, 1);
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2b });
const crownMats = [0x2e7d32, 0x388e3c, 0x1b5e20, 0x558b2f].map(
  c => new THREE.MeshLambertMaterial({ color: c, flatShading: true })
);
const placed = []; // {obj, type, lng, lat}

// s (size) and ci (crown colour index) are random by default but can be passed in
// so a tree looks the same after the session is restored.
function makeTree(lng, lat, s = 0.8 + Math.random() * 0.8, ci = Math.floor(Math.random() * crownMats.length)) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 2;
  const crown = new THREE.Mesh(crownGeo, crownMats[ci]);
  crown.position.y = 6;
  crown.scale.set(1, 1.2, 1);
  g.add(trunk, crown);
  g.scale.setScalar(s);
  g.position.copy(toScene(lng, lat, groundAt(lng, lat)));
  g.userData = { s, ci, lift: 0, hx: 3 * s, hz: 3 * s, y0: 0, y1: 9.6 * s };
  return g;
}

// ---------- building with procedural windows ----------
function windowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#d8d2c6'; x.fillRect(0, 0, 64, 64);   // wall
  x.fillStyle = '#5b7a99'; x.fillRect(14, 12, 36, 34); // glass
  x.fillStyle = '#eee';    x.fillRect(14, 12, 36, 3);  // frame top
  x.fillRect(30, 12, 4, 34);                           // frame middle
  x.fillStyle = '#b9b2a4'; x.fillRect(10, 46, 44, 4);  // sill
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const baseWinTex = windowTexture();

function makeBuilding(lng, lat, w = 14, d = 10, floors = 5) {
  const h = floors * 3.2;
  const side = (repeatX) => {
    const t = baseWinTex.clone();
    t.needsUpdate = true;
    t.repeat.set(Math.max(1, Math.round(repeatX / 3.5)), floors);
    return new THREE.MeshLambertMaterial({ map: t });
  };
  const roof = new THREE.MeshLambertMaterial({ color: 0x8a4b3b });
  // order: +x, -x, +y, -y, +z, -z
  const mats = [side(d), side(d), roof, roof, side(w), side(w)];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
  const p = toScene(lng, lat, groundAt(lng, lat));
  mesh.position.set(p.x, p.y + h / 2, p.z);
  mesh.userData = { lift: h / 2, hx: w / 2, hz: d / 2, y0: 0, y1: h };
  return mesh;
}

// Create, add and register an object we placed ourselves. `saved` carries tree params on restore.
function addObject(type, lng, lat, saved = {}) {
  const obj = type === 'tree' ? makeTree(lng, lat, saved.s, saved.ci) : makeBuilding(lng, lat);
  scene.add(obj);
  placed.push({ obj, type, lng, lat });
  return obj;
}

// Terrain tiles load as you look around, so keep placed objects sitting on the ground.
function refreshPlacedHeights() {
  for (const p of placed) {
    const e = map.queryTerrainElevation([p.lng, p.lat]);
    if (e == null) continue;
    p.obj.position.y = e + (map.transform.elevation || 0) + (p.obj.userData.lift || 0);
  }
}

// ---------- custom layer ----------
const customLayer = {
  id: 'three-layer',
  type: 'custom',
  renderingMode: '3d',
  onAdd(map, gl) {
    this.renderer = new THREE.WebGLRenderer({ canvas: map.getCanvas(), context: gl, antialias: true });
    this.renderer.autoClear = false;
  },
  render(gl, matrix) {
    const rotX = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), Math.PI / 2);
    const m = new THREE.Matrix4().fromArray(matrix);
    const l = new THREE.Matrix4()
      .makeTranslation(originMerc.x, originMerc.y, originMerc.z)
      .scale(new THREE.Vector3(unit, -unit, unit))
      .multiply(rotX);
    camera.projectionMatrix = m.multiply(l);
    // Objects store absolute heights; the map's 3D space is relative to the screen centre's height.
    scene.position.y = -(map.transform.elevation || 0);
    if (cadastre) cadastre.update(camera);
    this.renderer.resetState();
    this.renderer.render(scene, camera);
    map.triggerRepaint();
  }
};

// ---------- map buildings: select / delete ----------
// OpenFreeMap merges many buildings into one MultiPolygon feature per tile, so a layer filter
// can only hide whole groups at once. Instead we copy every building polygon out of the tiles
// into our own GeoJSON source (one polygon per building part) and draw that. Deleting a building
// just leaves its polygons out; each is remembered as one point inside the polygon.
// Large buildings (church, Experimenta, ...) consist of several touching parts, so selecting
// one part selects the whole group of connected footprints, and delete / restore act on the group.
const EMPTY = { type: 'FeatureCollection', features: [] };
const buildings = new Map();  // key -> { poly, props, bbox, sbox, feature, pt, scene }
const deleted = [];           // [[lng, lat], ...] one interior point per deleted building part
let selected = null;          // { kind: 'building', b, group } | { kind: 'tree', i } | { kind: 'placed', rec } | null
// Everything deleted this session, in order (so "Restore" can undo the latest one):
// { kind: 'building', pts: [[lng, lat], ...] } | { kind: 'tree', i } (cadastre tree index) | { kind: 'placed', type, lng, lat, s, ci }
const history = [];
// translucent orange box that marks a selected tree / placed object
const hl = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshBasicMaterial({ color: 0xff9800, transparent: true, opacity: 0.4, depthWrite: false })
);
hl.visible = false;
hl.renderOrder = 10;
scene.add(hl);
let tookOver = false;
let nextBid = 1;              // unique id per building polygon, used to hide the selected ones in the base layer

// --- geometry helpers ---
function ringArea(r) {
  let a = 0;
  for (let i = 0; i < r.length - 1; i++) a += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
  return a / 2;
}
function pointInRing(pt, r) {
  let inside = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inPolygon(pt, poly) {
  return pointInRing(pt, poly[0]) && !poly.slice(1).some(h => pointInRing(pt, h));
}
// a point that is really inside the polygon (centroid, a point between centroid and a corner,
// or as a last resort a grid scan over the bounding box)
function interiorPoint(poly) {
  const ring = poly[0];
  let A = 0, cx = 0, cy = 0;
  for (let i = 0; i < ring.length - 1; i++) {
    const cr = ring[i][0] * ring[i + 1][1] - ring[i + 1][0] * ring[i][1];
    A += cr;
    cx += (ring[i][0] + ring[i + 1][0]) * cr;
    cy += (ring[i][1] + ring[i + 1][1]) * cr;
  }
  if (Math.abs(A) < 1e-18) { cx = ring[0][0]; cy = ring[0][1]; }
  else { cx /= 3 * A; cy /= 3 * A; }
  const candidates = [[cx, cy], ...ring.map(v => [(v[0] + cx) / 2, (v[1] + cy) / 2])];
  const found = candidates.find(c => inPolygon(c, poly));
  if (found) return found;

  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of ring) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const N = 12;
  for (let i = 1; i < N; i++) {
    for (let j = 1; j < N; j++) {
      const p = [x0 + ((x1 - x0) * i) / N, y0 + ((y1 - y0) * j) / N];
      if (inPolygon(p, poly)) return p;
    }
  }
  return null;
}

// --- copy building polygons out of the loaded vector tiles ---
function collectBuildings() {
  if (!map.getSource('openmaptiles') || map.getZoom() < 14) return;
  const fs = map.querySourceFeatures('openmaptiles', { sourceLayer: 'building' });
  let added = 0;
  for (const f of fs) {
    const g = f.geometry;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    const props = { render_height: f.properties.render_height, render_min_height: f.properties.render_min_height };
    for (const poly of polys) {
      const ring = poly[0];
      if (!ring || ring.length < 4) continue;
      const key = `${props.render_height}|${props.render_min_height}|${ring[0][0].toFixed(6)},${ring[0][1].toFixed(6)}|${ring.length}`;
      if (buildings.has(key)) continue;
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const [x, y] of ring) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
      const a = toScene(x0, y0, 0), c = toScene(x1, y1, 0); // scene x grows east, z grows south
      const bprops = { ...props, bid: nextBid++ };
      buildings.set(key, {
        key, poly, props: bprops,
        bbox: [x0, y0, x1, y1],
        sbox: [Math.min(a.x, c.x), Math.max(a.x, c.x), Math.min(a.z, c.z), Math.max(a.z, c.z)],
        feature: { type: 'Feature', geometry: { type: 'Polygon', coordinates: poly }, properties: bprops },
        pt: null, scene: null
      });
      added++;
    }
  }
  if (added) {
    refreshBuildings();
    if (!tookOver) { // our layer now draws the buildings; hide the original tile layer
      tookOver = true;
      map.setPaintProperty('buildings-3d', 'fill-extrusion-opacity', 0);
    }
  }
}

function isDeleted(b) {
  return deleted.some(p => p[0] >= b.bbox[0] && p[0] <= b.bbox[2] && p[1] >= b.bbox[1] && p[1] <= b.bbox[3] && inPolygon(p, b.poly));
}
function refreshBuildings() {
  const src = map.getSource('buildings-own');
  if (src) {
    const features = [];
    for (const b of buildings.values()) if (!isDeleted(b)) features.push(b.feature);
    src.setData({ type: 'FeatureCollection', features });
  }
  refreshSelection();
}
function refreshSelection() {
  const src = map.getSource('building-selected');
  const isBuilding = selected && selected.kind === 'building';
  if (src) src.setData(isBuilding
    ? { type: 'FeatureCollection', features: selected.group.map(g => g.feature) }
    : EMPTY);
  // Hide the selected polygons in the base layer while they are highlighted. Two copies of the
  // same walls on top of each other flicker (z-fighting), which showed as orange stripes.
  if (map.getLayer('buildings-own')) {
    map.setFilter('buildings-own', isBuilding
      ? ['!', ['in', ['get', 'bid'], ['literal', selected.group.map(g => g.props.bid)]]]
      : null);
  }
  updateHighlight();
}
function updateHighlight() {
  hl.visible = false;
  if (!selected) return;
  if (selected.kind === 'tree' && cadastre) {
    const t = cadastre.info(selected.i);
    hl.position.set(t.x, t.elev + t.H / 2, t.z);
    hl.scale.set(t.crown, t.H, t.crown);
    hl.visible = true;
  } else if (selected.kind === 'placed') {
    placedBox(selected.rec.obj, _box);
    _box.getCenter(hl.position);
    _box.getSize(hl.scale);
    hl.visible = true;
  }
}

// --- picking: cast the click's camera ray through our own building footprints ---
// Uses the same projection matrix the three.js layer renders with, so it matches what you see.
function pickRay(point) {
  const c = map.getCanvas();
  const x = (point.x / c.clientWidth) * 2 - 1;
  const y = 1 - (point.y / c.clientHeight) * 2;
  const inv = camera.projectionMatrix.clone().invert();
  const near = new THREE.Vector3(x, y, -1).applyMatrix4(inv);
  const far = new THREE.Vector3(x, y, 1).applyMatrix4(inv);
  const elev = map.transform.elevation || 0; // scene.position.y = -elev, undo that
  near.y += elev; far.y += elev;
  return { o: near, d: far.sub(near).normalize() };
}
function segBoxRange(ax, az, bx, bz, box) {
  let s0 = 0, s1 = 1;
  const axes = [[ax, bx - ax, box[0], box[1]], [az, bz - az, box[2], box[3]]];
  for (const [a, dl, lo, hi] of axes) {
    if (Math.abs(dl) < 1e-9) { if (a < lo || a > hi) return null; continue; }
    let t1 = (lo - a) / dl, t2 = (hi - a) / dl;
    if (t1 > t2) [t1, t2] = [t2, t1];
    s0 = Math.max(s0, t1); s1 = Math.min(s1, t2);
    if (s0 > s1) return null;
  }
  return [s0, s1];
}

// footprint in scene metres (x = east, z = south), computed lazily
function ensureScene(b) {
  if (!b.scene) b.scene = b.poly.map(r => r.map(([lng, lat]) => { const v = toScene(lng, lat, 0); return [v.x, v.z]; }));
  return b.scene;
}
function insideScene(b, p) {
  const s = ensureScene(b);
  return pointInRing(p, s[0]) && !s.slice(1).some(h => pointInRing(p, h));
}

// --- grouping: building parts that touch or overlap belong together ---
const TOUCH_EPS = 1.2;   // metres; tile coordinates are quantised to ~0.4 m and simplified, so shared walls can be ~1 m apart
const MAX_GROUP = 300;   // safety cap so grouping can't spread across a whole city block

function distPtSeg(p, a, b) {
  const dx = b[0] - a[0], dz = b[1] - a[1], l2 = dx * dx + dz * dz;
  let t = l2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dz) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dz);
}
function ringNear(pts, ring) {            // any vertex of pts within eps of ring's edges?
  for (const p of pts)
    for (let i = 0; i < ring.length - 1; i++)
      if (distPtSeg(p, ring[i], ring[i + 1]) <= TOUCH_EPS) return true;
  return false;
}
function segsCross(a, b, c, d) {
  const o = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
  return (o(a, b, c) > 0) !== (o(a, b, d) > 0) && (o(c, d, a) > 0) !== (o(c, d, b) > 0);
}
function footprintsTouch(a, b) {
  const A = ensureScene(a)[0], B = ensureScene(b)[0];
  if (A.some(p => pointInRing(p, B)) || B.some(p => pointInRing(p, A))) return true; // overlap / containment
  if (ringNear(A, B) || ringNear(B, A)) return true;                                 // shared edge or corner
  for (let i = 0; i < A.length - 1; i++)                                             // crossing edges
    for (let j = 0; j < B.length - 1; j++)
      if (segsCross(A[i], A[i + 1], B[j], B[j + 1])) return true;
  return false;
}
function connectedGroup(start) {
  const group = [start], seen = new Set([start.key]);
  for (let i = 0; i < group.length && group.length < MAX_GROUP; i++) {
    const s = group[i].sbox;
    for (const b of buildings.values()) {
      if (seen.has(b.key)) continue;
      const t = b.sbox;
      if (t[1] < s[0] - TOUCH_EPS || t[0] > s[1] + TOUCH_EPS || t[3] < s[2] - TOUCH_EPS || t[2] > s[3] + TOUCH_EPS) continue;
      if (isDeleted(b) || !footprintsTouch(group[i], b)) continue;
      seen.add(b.key);
      group.push(b);
    }
  }
  return group;
}
// the polygons that get selected / deleted together; each needs an interior point to be deletable
function groupFor(b) {
  const group = connectedGroup(b);
  for (const g of group) if (!g.pt) g.pt = interiorPoint(g.poly);
  const usable = group.filter(g => g.pt);
  if (usable.length !== group.length) console.warn('[group] parts without interior point:', group.length - usable.length);
  return usable;
}

function pickBuilding(point, ray) {
  const { o, d } = ray;
  if (d.y > -1e-4) return null;
  const ll = map.unproject(point);
  const g = groundAt(ll.lng, ll.lat);              // absolute ground height near the click
  const tTop = Math.max(0, (g + 150 - o.y) / d.y); // ray portion between 150 m above and 3 m below ground
  const tBot = (g - 3 - o.y) / d.y;
  const ax = o.x + d.x * tTop, az = o.z + d.z * tTop;
  const bx = o.x + d.x * tBot, bz = o.z + d.z * tBot;
  let best = null, bestT = Infinity;
  for (const b of buildings.values()) {
    const r = segBoxRange(ax, az, bx, bz, b.sbox);
    if (!r || isDeleted(b)) continue;
    const base = g + (b.props.render_min_height || 0);
    const top = g + (b.props.render_height ?? 8);
    const N = 40;
    for (let k = 0; k <= N; k++) {
      const s = r[0] + ((r[1] - r[0]) * k) / N;
      const t = tTop + (tBot - tTop) * s;
      if (t >= bestT) break;
      const y = o.y + d.y * t;
      if (y < base || y > top) continue;
      if (insideScene(b, [ax + (bx - ax) * s, az + (bz - az) * s])) { best = b; bestT = t; break; }
    }
  }
  return best ? { b: best, t: bestT } : null;
}

// --- select anything pickable: map buildings, cadastre trees, placed trees/buildings ---
const _ray = new THREE.Ray();
const _box = new THREE.Box3();
const _hit = new THREE.Vector3();
function placedBox(obj, box) {
  const u = obj.userData, ground = obj.position.y - (u.lift || 0);
  box.min.set(obj.position.x - u.hx, ground + u.y0, obj.position.z - u.hz);
  box.max.set(obj.position.x + u.hx, ground + u.y1, obj.position.z + u.hz);
  return box;
}
function selectAt(point) {
  collectBuildings(); // pick up polygons from tiles that loaded since the last idle event
  const ray = pickRay(point);
  let best = null; // nearest hit along the ray wins
  const consider = (t, sel) => { if (!best || t < best.t) best = { t, sel }; };

  const bh = pickBuilding(point, ray);
  if (bh) consider(bh.t, { kind: 'building', b: bh.b });

  if (cadastre) {
    const th = cadastre.pick(ray.o, ray.d);
    if (th) consider(th.t, { kind: 'tree', i: th.index });
  }

  _ray.set(ray.o, ray.d);
  for (const rec of placed) {
    if (!_ray.intersectBox(placedBox(rec.obj, _box), _hit)) continue;
    consider(ray.o.distanceTo(_hit), { kind: 'placed', rec });
  }

  selected = best ? best.sel : null;
  if (selected && selected.kind === 'building') {
    selected.group = groupFor(selected.b);
    if (!selected.group.includes(selected.b)) selected = null;
    else console.info('[group]', selected.group.length, selected.group.map(g => g.key));
  }
  console.info('[select]', { kind: selected && selected.kind, distance: best && best.t });
  refreshSelection();
  updateCount();
}

function deleteSelected() {
  if (!selected) return;
  if (selected.kind === 'building') {
    const pts = selected.group.map(g => g.pt);
    pts.forEach(p => deleted.push(p));
    history.push({ kind: 'building', pts });
    refreshBuildings();
  } else if (selected.kind === 'tree') {
    cadastre.hide(selected.i);
    history.push({ kind: 'tree', i: selected.i });
  } else if (selected.kind === 'placed') {
    const rec = selected.rec;
    scene.remove(rec.obj);
    placed.splice(placed.indexOf(rec), 1);
    history.push({ kind: 'placed', type: rec.type, lng: rec.lng, lat: rec.lat, s: rec.obj.userData.s, ci: rec.obj.userData.ci });
  }
  selected = null;
  refreshSelection();
  updateCount();
  saveSession();
}
function restoreLastDeleted() {
  const h = history.pop();
  if (!h) return;
  if (h.kind === 'building') {
    for (const pt of h.pts) {
      const k = deleted.findIndex(p => p[0] === pt[0] && p[1] === pt[1]);
      if (k >= 0) deleted.splice(k, 1);
    }
    refreshBuildings();
  } else if (h.kind === 'tree') {
    if (cadastre) cadastre.show(h.i);
  } else if (h.kind === 'placed') {
    addObject(h.type, h.lng, h.lat, h);
  }
  updateCount();
  saveSession();
}

// ---------- session persistence (sessionStorage: survives reloads, cleared when the tab closes) ----------
const STORE_KEY = 'heilbronn3d-session';
function saveSession() {
    window.dispatchEvent(new Event('scene-changed'));
  try {
    sessionStorage.setItem(STORE_KEY, JSON.stringify({
      placed: placed.map(p => ({ type: p.type, lng: p.lng, lat: p.lat, s: p.obj.userData.s, ci: p.obj.userData.ci })),
      history
    }));
  } catch (err) { console.warn('Could not save session', err); }
}
function restoreSession() {
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem(STORE_KEY) || 'null'); } catch { /* ignore */ }
  if (!s) return;
  (s.placed || []).forEach(p => addObject(p.type, p.lng, p.lat, p));
  // older sessions stored only building points in `deleted`
  let h = s.history;
  if (!h && s.deleted) h = s.deleted.map(d => ({ kind: 'building', pt: Array.isArray(d) ? d : d && d.pt })).filter(e => e.pt);
  (h || []).forEach(e => {
    // older entries held a single point (`pt`); newer ones hold the whole group (`pts`)
    if (e.kind === 'building' && !e.pts) e = { kind: 'building', pts: [e.pt] };
    history.push(e);
    if (e.kind === 'building') e.pts.forEach(p => deleted.push(p));
  });
  refreshBuildings();
  updateCount();
}

// ---------- map setup ----------
map.on('load', () => {
  map.addSource('terrain', {
    type: 'raster-dem',
    tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
    encoding: 'terrarium', tileSize: 256, maxzoom: 14
  });
  map.setTerrain({ source: 'terrain', exaggeration: 1 }); // keep 1 so heights match

  // Light map: drop every text/icon layer except street names (no POIs, transit, place names).
  for (const layer of map.getStyle().layers) {
    if (layer.type === 'symbol' && layer['source-layer'] !== 'transportation_name') map.removeLayer(layer.id);
  }

  // Some colour: blue water, green parks/grass/forest (Positron is all grey by default).
  map.setPaintProperty('water', 'fill-color', '#a9cfe6');
  map.setPaintProperty('waterway', 'line-color', '#a9cfe6');
  map.setPaintProperty('park', 'fill-color', '#cfe6c2');
  map.setPaintProperty('landcover_wood', 'fill-color', '#b7d9a8');
  map.addLayer({
    id: 'landcover_grass', type: 'fill', source: 'openmaptiles', 'source-layer': 'landcover',
    filter: ['in', ['get', 'class'], ['literal', ['grass', 'farmland', 'wetland']]],
    paint: { 'fill-color': ['match', ['get', 'class'], 'farmland', '#e6efd2', '#d6ebc8'] }
  }, 'water');

  addCadastre({ THREE, map, scene, toScene }).then(c => {
    cadastre = c;
    history.forEach(h => { if (h.kind === 'tree') c.hide(h.i); });
    updateCount();
  });

  if (map.getLayer('building-3d')) map.removeLayer('building-3d');
  map.addLayer({
    id: 'buildings-3d', type: 'fill-extrusion', source: 'openmaptiles',
    'source-layer': 'building', minzoom: 14,
    paint: {
      'fill-extrusion-color': '#e8e4dc',
      'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
      'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
      'fill-extrusion-opacity': 0.9
    }
  });

  // Our own building layer (one polygon per building part, filled by collectBuildings()).
  map.addSource('buildings-own', { type: 'geojson', data: EMPTY, tolerance: 0.1 });
  map.addLayer({
    id: 'buildings-own', type: 'fill-extrusion', source: 'buildings-own', minzoom: 14,
    paint: {
      'fill-extrusion-color': '#e8e4dc',
      'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
      'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
      'fill-extrusion-opacity': 0.9
    }
  });

  // Highlight for the selected building: its own geometry, drawn in orange in place of the base layer's copy.
  map.addSource('building-selected', { type: 'geojson', data: EMPTY });
  map.addLayer({
    id: 'buildings-selected', type: 'fill-extrusion', source: 'building-selected',
    paint: {
      'fill-extrusion-color': '#ff9800',
      'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
      'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
      'fill-extrusion-opacity': 0.95
    }
  });

  map.addLayer(customLayer);

  restoreSession();                       // bring back this session's trees/buildings/deletions
  map.on('idle', refreshPlacedHeights);   // keep placed objects on the terrain
  map.on('idle', collectBuildings);        // pick up building polygons from newly loaded tiles
  collectBuildings();
  window.__app.ready = true;
  window.dispatchEvent(new Event('app-ready'));

  // 'idle' fires every frame (the custom layer keeps repainting), so only do the heavy work
  // after the view moved or new terrain / building tiles arrived.
  let viewStale = true;
  const markStale = () => { viewStale = true; };
  map.on('moveend', markStale);
  map.on('sourcedata', (e) => { if (e.sourceId === 'terrain' || e.sourceId === 'openmaptiles') markStale(); });
  map.on('idle', () => {
    if (!viewStale) return;
    viewStale = false;
    refreshPlacedHeights();   // keep placed objects on the terrain
    collectBuildings();       // pick up building polygons from newly loaded tiles
    updateHighlight();
  });
});

// ---------- interaction ----------
const countEl = document.getElementById('count');
function updateCount() {
  const t = placed.filter(p => p.type === 'tree').length;
  const b = placed.filter(p => p.type === 'building').length;
  let text = `Trees: ${t} | Buildings: ${b}`;
  if (cadastre) text += ` | Cadastre: ${cadastre.visibleCount.toLocaleString()} / ${cadastre.count.toLocaleString()} loaded`;
  if (history.length) text += ` | Deleted: ${history.length}`;
  if (selected) {
    text += ` | Selected: ${{ building: 'building', tree: 'cadastre tree', placed: 'placed object' }[selected.kind]}`;
    if (selected.kind === 'building' && selected.group.length > 1) text += ` (${selected.group.length} parts)`;
  }
  if (countEl.textContent !== text) countEl.textContent = text;
}
setInterval(updateCount, 250);

map.on('click', (e) => {
  if (mode === 'nav') return;
  if (mode === 'inspect') {
    const hit = cadastre && cadastre.inspect(e.lngLat);
    if (hit) new maplibregl.Popup().setLngLat(hit.lngLat).setHTML(hit.html).addTo(map);
    return;
  }
  if (mode === 'select') {
    selectAt(e.point);
    return;
  }

  const { lng, lat } = e.lngLat;
  addObject(mode, lng, lat);
  updateCount();
  saveSession();
});

function setMode(m, btnId) {
  mode = m;
  document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
  document.getElementById(btnId).classList.add('active');
  if (m !== 'select' && selected) { selected = null; refreshSelection(); updateCount(); }
}
btnTree.onclick = () => setMode('tree', 'btnTree');
btnBuilding.onclick = () => setMode('building', 'btnBuilding');
btnNav.onclick = () => setMode('nav', 'btnNav');
btnUndo.onclick = () => {
  const last = placed.pop();
  if (last) scene.remove(last.obj);
  updateCount();
  saveSession();
};
btnInspect.onclick = () => setMode('inspect', 'btnInspect');
btnSelect.onclick = () => setMode('select', 'btnSelect');
btnDelete.onclick = deleteSelected;
btnRestore.onclick = restoreLastDeleted;
document.addEventListener('keydown', (e) => {
  if (mode === 'select' && (e.key === 'Delete' || e.key === 'Backspace')) {
    e.preventDefault();
    deleteSelected();
  }
});

// Real trees from OpenStreetMap (free Overpass API), capped to keep it smooth
btnOsm.onclick = async () => {
  btnOsm.textContent = 'Loading...';
  const c = map.getCenter();
  const d = 0.004; // ~400 m box around the current view center
  const q = `[out:json];node["natural"="tree"](${c.lat - d},${c.lng - d},${c.lat + d},${c.lng + d});out 1500;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST', body: 'data=' + encodeURIComponent(q)
    });
    const data = await res.json();
    data.elements.forEach(n => addObject('tree', n.lon, n.lat));
    updateCount();
    saveSession();
    btnOsm.textContent = `Loaded ${data.elements.length} trees`;
  } catch (err) {
    console.error(err);
    btnOsm.textContent = 'Failed, try again';
  }
};
window.__app = { map, placed, deleted, buildings, isDeleted, ready: false };
updateCount();
import { addComparisonCard } from './comparison-card.js'; addComparisonCard({ map, scene, placed, deleted });
</script>
